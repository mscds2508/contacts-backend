<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <!-- Header -->

        <header class="header">

            <div>
                <h1>Contact Manager</h1>

                <p>
                    Manage your contacts easily
                </p>
            </div>

        </header>


        <!-- Add Contact -->

        <section class="add-section">

            <h2>Add New Contact</h2>

            <form id="contactForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="text"
                            id="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required
                        >

                    </div>

                </div>

                <button type="submit">
                    Add Contact
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- Contacts -->

        <section class="contacts-section">

            <div class="section-title">

                <h2>Your Contacts</h2>

                <span id="contactCount">
                    0 contacts
                </span>

            </div>


            <div
                id="contactsContainer"
                class="contacts-grid"
            >

                <p class="loading">
                    Loading contacts...
                </p>

            </div>

        </section>

    </div>


    <script>

        const contactForm =
            document.getElementById("contactForm");

        const contactsContainer =
            document.getElementById("contactsContainer");

        const contactCount =
            document.getElementById("contactCount");

        const message =
            document.getElementById("message");


        // Load contacts

        async function loadContacts() {

            try {

                const response =
                    await fetch("/api/contacts");

                const contacts =
                    await response.json();

                displayContacts(contacts);

            } catch (error) {

                contactsContainer.innerHTML = `
                    <p class="error">
                        Unable to load contacts.
                    </p>
                `;

            }

        }


        // Display contacts

        function displayContacts(contacts) {

            contactCount.textContent =
                `${contacts.length} contact${contacts.length !== 1 ? "s" : ""}`;


            if (contacts.length === 0) {

                contactsContainer.innerHTML = `
                    <p class="empty">
                        No contacts available.
                    </p>
                `;

                return;

            }


            contactsContainer.innerHTML = contacts.map(contact => `

                <div class="contact-card">

                    <div class="avatar">
                        ${contact.name.charAt(0).toUpperCase()}
                    </div>

                    <div class="contact-info">

                        <h3>
                            ${contact.name}
                        </h3>

                        <p>
                            📞 ${contact.phone}
                        </p>

                        <p>
                            ✉️ ${contact.email}
                        </p>

                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteContact(${contact.id})"
                    >
                        Delete
                    </button>

                </div>

            `).join("");

        }


        // Add contact

        contactForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value;

                const phone =
                    document.getElementById("phone").value;

                const email =
                    document.getElementById("email").value;


                try {

                    const response =
                        await fetch("/api/contacts", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                phone: phone,
                                email: email
                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.error;

                        message.className = "error";

                        return;

                    }


                    message.textContent =
                        "Contact added successfully!";

                    message.className =
                        "success";


                    contactForm.reset();

                    loadContacts();

                } catch (error) {

                    message.textContent =
                        "Something went wrong.";

                    message.className =
                        "error";

                }

            }
        );


        // Delete contact

        async function deleteContact(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this contact?"
                );


            if (!confirmed) {
                return;
            }


            try {

                await fetch(
                    `/api/contacts/${id}`,
                    {
                        method: "DELETE"
                    }
                );

                loadContacts();

            } catch (error) {

                alert(
                    "Unable to delete contact."
                );

            }

        }


        // Load contacts when page opens

        loadContacts();

    </script>

</body>

</html>
